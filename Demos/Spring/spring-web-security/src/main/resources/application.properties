spring.application.name=spring-starter

# ============================================
# Data - SQLite
# ============================================
spring.datasource.url=jdbc:sqlite:./database.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite lives in Hibernate's community dialects, not core
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect

# create-drop for a throwaway demo, update to keep data between runs
spring.jpa.hibernate.ddl-auto=update

# SQLite is single-writer; one connection avoids "database is locked"
spring.datasource.hikari.maximum-pool-size=1

# Visible SQL for teaching
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# Web
# ============================================
server.port=8080
server.error.include-message=always

# ============================================
# Security - JWT
# ============================================
# Base64-encoded key material, decoded back to raw bytes at startup. JJWT picks
# the HMAC algorithm from the key LENGTH: 32 bytes -> HS256, 48 -> HS384,
# 64 -> HS512. This one is 48 bytes, so tokens come out signed HS384 (you can
# see it in the decoded token header). Anything under 32 bytes fails at startup.
# Generate your own with:
#     openssl rand -base64 48
app.jwt.secret=Z6osXxtqM4zQz3ZPO44/h2W3BbuzasU/rEMX9AhPcGHs/nSoRkT5fwWxj7vYvswz

# How long an issued token stays valid. 1800s = 30 minutes.
app.jwt.ttl-seconds=1800

# A "Secure" cookie is only ever sent over HTTPS, so a browser will silently
# refuse to store one from http://localhost. Keep this false for the demo,
# flip it to true anywhere real.
app.jwt.cookie-secure=false

# ============================================
# Security - CORS
# ============================================
# This CANNOT be "*" while allow-credentials is on (Spring throws at startup),
# because "send my cookies to anyone" is exactly the hole CORS exists to close.
# List the real front-end origins instead.
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
