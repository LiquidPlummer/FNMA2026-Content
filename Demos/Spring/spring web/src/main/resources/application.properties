spring.application.name=spring-starter

# ============================================
# Data - SQLite
# ============================================
spring.datasource.url=jdbc:sqlite:./database.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite lives in Hibernate's community dialects, not core
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect

# create-drop for a throwaway demo, update to keep data between runs
spring.jpa.hibernate.ddl-auto=update

# SQLite is single-writer; one connection avoids "database is locked"
spring.datasource.hikari.maximum-pool-size=1

# Visible SQL for teaching
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# Web
# ============================================
server.port=7000
server.error.include-message=always
