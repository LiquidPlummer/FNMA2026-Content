plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '8.3.11'
}

group = 'com.revature'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // implementation platform('software.amazon.awssdk:bom:2.46.6')
    // implementation 'software.amazon.awssdk:dynamodb-enhanced'
    // implementation 'software.amazon.awssdk:signin'

    testImplementation platform('org.junit:junit-bom:5.11.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'


    implementation("org.xerial:sqlite-jdbc:3.49.1.0")
    //
    implementation("io.javalin:javalin:7.2.0")
    implementation("org.slf4j:slf4j-simple:2.0.13")
}

application {
    mainClass = 'com.training.dynamodb.App'
}

// Stretch goal (Section 7): produces build/libs/app.jar as a single
// runnable fat jar — `java -jar app.jar` works with no external classpath.
shadowJar {
    archiveBaseName.set('app')
    archiveClassifier.set('')
    archiveVersion.set('')
    mergeServiceFiles()
}

test {
    useJUnitPlatform()
}