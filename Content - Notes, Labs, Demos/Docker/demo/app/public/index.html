<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docker Demo App</title>
<style>
  body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
         background: #0d1117; color: #e6edf3; margin: 0;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  main { padding: 2rem; max-width: 40rem; width: 100%; }
  h1 { font-size: 2rem; margin: 0 0 1.5rem; color: #58a6ff; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: .6rem 1.5rem; margin: 0; font-size: 1.1rem; }
  dt { color: #8b949e; }
  dd { margin: 0; word-break: break-all; }
  .ok { color: #3fb950; }
  .off { color: #f85149; }
</style>
</head>
<body>
<main>
  <h1 id="greeting">loading…</h1>
  <dl>
    <dt>hostname</dt><dd id="hostname">—</dd>
    <dt>platform</dt><dd id="platform">—</dd>
    <dt>node</dt><dd id="node">—</dd>
    <dt>pid</dt><dd id="pid">—</dd>
    <dt>database</dt><dd id="db">—</dd>
  </dl>
</main>
<script>
  async function load() {
    const r = await fetch('/api/info');
    const d = await r.json();
    document.getElementById('greeting').textContent = d.greeting;
    document.getElementById('hostname').textContent = d.hostname;
    document.getElementById('platform').textContent = d.platform;
    document.getElementById('node').textContent = d.node;
    document.getElementById('pid').textContent = d.pid;
    const db = document.getElementById('db');
    db.textContent = d.db.detail;
    db.className = d.db.connected ? 'ok' : 'off';
  }
  load();
  setInterval(load, 5000);
</script>
</body>
</html>
