<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Path Visualizer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Event Path Visualizer</h1>
  <p class="hint">Open the console too — some steps log there as well.</p>

  <div class="layout">
    <section>
      <div id="outer" class="box">
        <span class="tag">#outer</span>
        <div id="middle" class="box">
          <span class="tag">#middle</span>
          <button id="inner" class="target">#inner</button>
        </div>
      </div>

      <div class="controls">
        <button id="clear">Clear log</button>
        <input id="field" placeholder="focusable field">
      </div>
    </section>

    <section>
      <h2>Log</h2>
      <ol id="log" class="log"></ol>
    </section>
  </div>

  <script src="main.js"></script>
</body>
</html>
